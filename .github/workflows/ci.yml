name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # For the internal/db tests, which need a real database (login lockout
    # under concurrency, batch insert error handling).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auction
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://auction:auction@localhost:5432/auction?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

  dashboards:
    name: Grafana dashboards in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # k8s/ keeps copies of the compose dashboards (kustomize can't read
      # files outside k8s/); fail if one was edited without the other.
      - name: compose and k8s dashboards are identical
        run: |
          for f in app-overview.json k6-load-test.json; do
            diff -u "deploy/grafana/provisioning/dashboards/json/$f" "k8s/monitoring/dashboards/$f"
          done

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check + build
        run: npm run build
