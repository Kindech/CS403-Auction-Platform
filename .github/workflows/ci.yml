name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

  dashboards:
    name: Grafana dashboards in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # k8s/ keeps copies of the compose dashboards (kustomize can't read
      # files outside k8s/); fail if one was edited without the other.
      - name: compose and k8s dashboards are identical
        run: |
          for f in app-overview.json k6-load-test.json; do
            diff -u "deploy/grafana/provisioning/dashboards/json/$f" "k8s/monitoring/dashboards/$f"
          done

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Type-check + build
        run: npm run build
