# Fixed, not "auto": auto means one worker per CPU core of the node, ignoring
# the pod's memory limit.
worker_processes 2;

# A proxied WebSocket uses 2 connections, so this is about 8000 viewers.
events {
    worker_connections 8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # $uri, not the default format's $request: the WebSocket URL carries the
    # login token as ?token=..., which doesn't belong in a log file.
    log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log no_query;

    # Unlike compose's nginx.conf there is no per-replica upstream list here:
    # "api-server" is the Kubernetes Service, whose stable ClusterIP spreads
    # connections over however many ready pods the HPA is running, and drops
    # a pod from rotation as soon as its readiness probe fails.
    proxy_connect_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }

        location /ws/ {
            proxy_pass http://api-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
