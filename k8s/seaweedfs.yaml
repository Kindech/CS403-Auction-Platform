# Item photos. api-server runs as 2-6 pods that the HPA creates and deletes,
# so photos can't sit on any pod's disk: every pod writes to this one
# S3-compatible store, and nginx serves the objects under /images/.
#
# SeaweedFS rather than MinIO: MinIO's images are no longer published on
# Docker Hub or quay.io. api-server only speaks the S3 API (minio-go), so a
# real S3 bucket or a MinIO you already have works by changing S3_ENDPOINT
# and the keys in backend-secrets.
#
# One pod, on a persistent volume, like Postgres and Redis here. Losing it
# stops photos loading and new uploads but not bidding.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          # master + volume + filer + S3 gateway in one process. -ip=localhost:
          # the parts only talk to each other inside this container; clients
          # use the S3 port through the Service. Small volumes (64 MB) because
          # the default 30 GB volume size is meant for big disks.
          args:
            - server
            - -dir=/data
            - -ip=localhost
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=0
            - -filer.disableDirListing
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
