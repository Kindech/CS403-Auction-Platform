# nginx serving the built frontend and proxying /api and /ws to the
# api-server Service. Docker Desktop maps a LoadBalancer Service to
# localhost, so the app is at http://localhost:8080 exactly as with compose.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: auction-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            # Every proxied WebSocket holds nginx buffers: at 128Mi the kernel
            # killed nginx workers under TC-03's 2000 viewers (signal 9), each
            # kill dropping that worker's connections.
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            # Replaces the compose nginx.conf baked into the image, which
            # names api-1/api-2 and Docker's DNS server.
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
