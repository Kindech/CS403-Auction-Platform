# Kubernetes deployment of the same stack deploy/docker-compose.yml runs,
# with api-server as a Deployment scaled by a HorizontalPodAutoscaler
# instead of the fixed api-1/api-2 pair. Apply with:
#   kubectl apply -k k8s/
# See k8s/README.md for building the images and installing metrics-server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auction

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - seaweedfs.yaml
  - api-server.yaml
  - bid-worker.yaml
  - frontend.yaml
  - monitoring.yaml

secretGenerator:
  # SeaweedFS S3 identities: api-server's key (read/write) and anonymous
  # read-only, which is what lets nginx serve /images/ without signing.
  # A copy of deploy/seaweedfs/s3.json.
  - name: seaweedfs-s3
    files:
      - s3.json=seaweedfs-s3.json

configMapGenerator:
  - name: nginx-conf
    files:
      - nginx.conf
  - name: prometheus-config
    files:
      - monitoring/prometheus.yml
  - name: grafana-datasources
    files:
      - monitoring/grafana-datasources.yml
  - name: grafana-dashboard-providers
    files:
      - monitoring/grafana-dashboards.yml
  # app-overview.json and k6-load-test.json are copies of the compose
  # dashboards in deploy/grafana (kustomize can't read files outside k8s/);
  # CI fails if they drift apart.
  - name: grafana-dashboards
    files:
      - monitoring/dashboards/app-overview.json
      - monitoring/dashboards/k6-load-test.json
      - monitoring/dashboards/k8s-scaling.json
