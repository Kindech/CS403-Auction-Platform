# Kafka as a 3-node KRaft cluster: every node is both a broker and a
# controller (KRaft replaced ZooKeeper - deprecated in Kafka 3.5, removed in
# 4.0 - controllers elect the cluster leader among themselves with Raft).
#
# Why 3: with one broker, a broker crash stops every bid until that broker's
# JVM has started again (~5s at best, TC-10). With 3, each partition has a
# leader and 2 followers holding the same data; if the leader dies the
# controllers move leadership to a follower that is in sync, and bidding
# carries on without waiting for the dead broker (TC-16).
#
# Guarantees: replication factor 3, min.insync.replicas 2, and producers use
# acks=all (backend/internal/kafkabus): a bid counts as taken only once at
# least 2 brokers have it, so losing any 1 broker loses no bid. Losing 2 at
# once makes Kafka refuse writes (bidders get "service_unavailable") rather
# than accept bids it could lose.
#
# All 3 pods run on this one Docker Desktop node, so this covers a broker
# process dying, not the machine dying - that needs a multi-node cluster.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # Bootstrap address for clients and for the wait-for-deps init containers:
  # any Ready broker. Clients then talk to each broker by its own name below.
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
---
# Per-pod DNS names (kafka-0.kafka-headless, ...) that brokers advertise and
# controllers use to reach each other. publishNotReadyAddresses: controllers
# must find each other before any of them is Ready, to elect a leader.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  # Start all 3 together: none can become Ready alone (a controller needs a
  # majority, 2 of 3), so the default one-after-another start would hang.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Required: Kubernetes would otherwise inject KAFKA_PORT,
      # KAFKA_SERVICE_HOST, ... for the "kafka" Service, and the apache/kafka
      # image turns every KAFKA_* variable into a broker setting.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          # Node id and advertised name come from the pod name (kafka-0 -> 1).
          command:
            - sh
            - -c
            - |
              export KAFKA_NODE_ID=$(( ${HOSTNAME##*-} + 1 ))
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless:9092"
              exec /__cacert_entrypoint.sh /etc/kafka/docker/run
          env:
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless:9093,2@kafka-1.kafka-headless:9093,3@kafka-2.kafka-headless:9093" }
            - { name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
            # Every topic, including consumer offsets, on all 3 brokers; a
            # write needs 2 of them.
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            # Never hand leadership to a replica that is missing bids.
            - { name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE, value: "false" }
            # How fast a dead broker is noticed: the controller fences a
            # broker that misses heartbeats for 1.5s (default 9s) and moves
            # its partitions' leadership to a follower. If the dead broker was
            # the active controller, the other two elect a new one once they
            # haven't heard from it for 1s (default 2s); after a split vote
            # (both candidates at once - seen in TC-16) they retry within
            # 0.3s instead of up to 1s.
            - { name: KAFKA_BROKER_HEARTBEAT_INTERVAL_MS, value: "250" }
            - { name: KAFKA_BROKER_SESSION_TIMEOUT_MS, value: "1500" }
            - { name: KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS, value: "1000" }
            - { name: KAFKA_CONTROLLER_QUORUM_ELECTION_BACKOFF_MAX_MS, value: "300" }
            # bid-worker's consumer uses a 2s session (backend/internal/kafkabus)
            # so it gets its partitions back within seconds of a broker
            # restart; the broker refuses sessions under 6s unless told
            # otherwise. And there is only ever one bid-worker, so don't wait
            # the default 3s for more members to join.
            - { name: KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS, value: "1000" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          ports:
            - containerPort: 9092
            - containerPort: 9093
          # The "kafka" Service only routes to a Ready pod. This used to wait
          # 10s before its first check and then check every 10s with a
          # command that starts a JVM, so the broker sat up but unreachable
          # for ~10s of every restart (measured: up 3.5s after start, Ready
          # 14.1s). The broker opens 9092 only once it has started.
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 1
            failureThreshold: 2
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Same as compose's kafka-init: 6 partitions keyed by item_id, here on all 3
# brokers. Retries until the cluster is reachable; --if-not-exists makes
# re-applying harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 20
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: create-topic
          image: apache/kafka:3.7.1
          command:
            - /opt/kafka/bin/kafka-topics.sh
            - --create
            - --if-not-exists
            - --topic
            - bid-requests
            - --partitions
            - "6"
            - --replication-factor
            - "3"
            - --config
            - min.insync.replicas=2
            - --bootstrap-server
            - kafka:9092
