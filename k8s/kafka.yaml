apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Required: Kubernetes would otherwise inject KAFKA_PORT,
      # KAFKA_SERVICE_HOST, ... for the "kafka" Service, and the apache/kafka
      # image turns every KAFKA_* variable into a broker setting.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
            - { name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
            # bid-worker's consumer uses a 3s session (backend/internal/kafkabus)
            # so it gets its partitions back within seconds of a broker
            # restart; the broker refuses sessions under 6s unless told
            # otherwise. And there is only ever one bid-worker, so don't wait
            # the default 3s for more members to join.
            - { name: KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS, value: "1000" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          ports:
            - containerPort: 9092
            - containerPort: 9093
          # The Service only routes to a Ready pod. This used to wait 10s
          # before its first check and then check every 10s with a command
          # that starts a JVM, so the broker sat up but unreachable for ~10s
          # of every restart (measured: up 3.5s after start, Ready 14.1s).
          # The broker opens 9092 only once it has started.
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 1
            failureThreshold: 2
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Same as compose's kafka-init: 6 partitions keyed by item_id. Retries until
# the broker is reachable; --if-not-exists makes re-applying harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 20
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: create-topic
          image: apache/kafka:3.7.1
          command:
            - /opt/kafka/bin/kafka-topics.sh
            - --create
            - --if-not-exists
            - --topic
            - bid-requests
            - --partitions
            - "6"
            - --replication-factor
            - "1"
            - --bootstrap-server
            - kafka:9092
