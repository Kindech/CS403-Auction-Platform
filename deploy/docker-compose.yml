x-backend-env: &backend-env
  POSTGRES_URL: postgres://auction:auction@postgres:5432/auction?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: redpanda:9092
  KAFKA_TOPIC: bid-requests
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    volumes:
      - ../backend/migrations:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --check=false
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      bash -c "rpk topic create bid-requests --partitions 6 --replicas 1 --brokers redpanda:9092 || true"
    restart: "no"

  api-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      BID_RATE_LIMIT_PER_SEC: "10"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"

  api-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      BID_RATE_LIMIT_PER_SEC: "10"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"

  bid-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      <<: *backend-env
      KAFKA_GROUP_ID: bid-worker
      PEER_INTERNAL_URLS: "http://api-1:8080,http://api-2:8080"
      ANTI_SNIPE_WINDOW: "60s"
      ANTI_SNIPE_EXTENSION: "60s"
      BATCH_SIZE: "50"
      BATCH_INTERVAL: "500ms"
      TICK_INTERVAL: "1s"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      api-1:
        condition: service_started
      api-2:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api-1
      - api-2

volumes:
  postgres-data:
