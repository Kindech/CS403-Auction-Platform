x-backend-env: &backend-env
  POSTGRES_URL: postgres://auction:auction@postgres:5432/auction?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: bid-requests
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    # Schema is applied by api-server/bid-worker on startup (db.Migrate),
    # which - unlike docker-entrypoint-initdb.d - also upgrades an existing
    # volume when a new migration file is added.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@auction.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # Live auction state (current price/leader) lives only here until the
    # item ends, so persist every write (AOF) to a named volume - losing it
    # used to make in-progress auctions finalize as "no bids".
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic bid-requests --partitions 6 --replication-factor 1
      --bootstrap-server kafka:9092
    restart: "no"

  api-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      BID_RATE_LIMIT_PER_SEC: "10"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"

  api-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      BID_RATE_LIMIT_PER_SEC: "10"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"

  bid-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      <<: *backend-env
      KAFKA_GROUP_ID: bid-worker
      PEER_INTERNAL_URLS: "http://api-1:8080,http://api-2:8080"
      ANTI_SNIPE_WINDOW: "60s"
      ANTI_SNIPE_EXTENSION: "60s"
      BATCH_SIZE: "50"
      BATCH_INTERVAL: "500ms"
      TICK_INTERVAL: "1s"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      api-1:
        condition: service_started
      api-2:
        condition: service_started
    restart: unless-stopped
    ports:
      - "9101:9101" # metrics

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver # lets k6 push load-test metrics directly
    ports:
      - "9090:9090"
    depends_on:
      - api-1
      - api-2
      - bid-worker

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api-1
      - api-2

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:
