worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # $uri, not the default format's $request: the WebSocket URL carries the
    # login token as ?token=..., which doesn't belong in a log file.
    log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log no_query;

    # Docker's embedded DNS. Re-resolving every 10s (with "resolve" below)
    # follows a replica to its new IP after it's recreated, and lets nginx
    # start even if a replica is down at the time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_servers {
        # round-robin across both api-server replicas, matching the
        # report's "horizontal scaling" design (report section 2.5.9).
        # One failed connection takes a replica out of rotation for 10s, so
        # traffic goes to the healthy one instead of waiting on the dead one.
        zone api_servers 64k;
        server api-1:8080 resolve max_fails=1 fail_timeout=10s;
        server api-2:8080 resolve max_fails=1 fail_timeout=10s;
    }

    upstream seaweedfs_s3 {
        zone seaweedfs_s3 64k;
        server seaweedfs:8333 resolve;
    }

    # Applied to both /api/ and /ws/: give up on an unreachable replica
    # after 2s (default is 60s) and retry the request on the other one.
    # nginx never retries a POST that already reached a replica, so a bid
    # or registration can't be submitted twice by this.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }

        location /ws/ {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Item photos, straight from the object store (SeaweedFS, S3 API) as
        # anonymous GETs - the bucket allows reads but not listing or writes.
        # Uploads go through api-server (/api/uploads/images), which checks
        # the login and the file type first.
        location /images/ {
            limit_except GET { deny all; }
            proxy_pass http://seaweedfs_s3/item-images/;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            add_header X-Content-Type-Options nosniff always;
        }

        # 8 MB photo + multipart overhead (nginx default is 1 MB).
        location = /api/uploads/images {
            client_max_body_size 9m;
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
