global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "api-server"
    static_configs:
      - targets: ["api-1:8080", "api-2:8080"]
        labels:
          service: "api-server"

  - job_name: "bid-worker"
    static_configs:
      - targets: ["bid-worker:9101"]
        labels:
          service: "bid-worker"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
